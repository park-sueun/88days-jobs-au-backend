spring.application.name=jobs-au-backend

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:4000}/${DB_NAME:88days_jobs_au}?allowPublicKeyRetrieval=true&useSSL=true&sslMode=VERIFY_IDENTITY
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-exp-min=${JWT_ACCESS_TOKEN_EXP_MIN:15}
jwt.refresh-token-exp-days=${JWT_REFRESH_TOKEN_EXP_DAYS:14}
